<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Caça-Níquel da Cervejinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b0f1f;--bg2:#2e1637;--amber:#ffb81c;--foam:#fff4d6;--wine:#a3224f;--ink:#fff4d6;--mute:#c9a9c9;--ok:#3ddc97;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));background-color:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:600;display:flex;justify-content:center;overflow-x:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
main{width:100%;max-width:460px;padding:clamp(12px,3vw,24px);display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4vh,22px);min-height:100dvh;justify-content:center}
h1{font-family:"Bagel Fat One","Arial Black",sans-serif;font-weight:400;font-size:clamp(1.9rem,9vw,2.8rem);line-height:1;margin:0;text-align:center;color:var(--amber);text-shadow:0 0 18px rgba(255,184,28,.55),0 3px 0 #7a4a00}
.sub{margin:0;color:var(--mute);text-align:center;font-size:.95rem}
.machine{width:100%;background:linear-gradient(#5a1b45,#3a1030);border:3px solid var(--amber);border-radius:28px;padding:clamp(12px,3.5vw,20px);box-shadow:0 0 0 6px #2a0c25,0 18px 40px rgba(0,0,0,.55),inset 0 0 30px rgba(0,0,0,.4)}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.5vw,14px);background:#12070f;padding:clamp(8px,2.5vw,12px);border-radius:18px;box-shadow:inset 0 4px 14px #000}
.reel{aspect-ratio:1;background:radial-gradient(circle at 50% 40%,#2b1230,#0c050d 75%);border:2px solid rgba(255,184,28,.35);border-radius:14px;display:grid;place-items:center;font-size:clamp(2.6rem,15vw,4.6rem);overflow:hidden;position:relative;box-shadow:inset 0 0 18px #000}
.reel img{width:86%;height:86%;border-radius:50%;object-fit:cover;border:3px solid var(--amber);box-shadow:0 0 14px rgba(255,184,28,.45)}
.reel.spin>*{animation:blur .09s linear infinite}
@keyframes blur{0%{transform:translateY(-30%);filter:blur(3px)}100%{transform:translateY(30%);filter:blur(3px)}}
.reel.stop>*{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateY(-40%) scale(.8)}100%{transform:none}}
.reel.win{outline:4px solid var(--ok);animation:glow .5s ease-in-out 4 alternate}
@keyframes glow{to{box-shadow:0 0 22px var(--ok),inset 0 0 18px #000}}
.msg{min-height:2.6em;margin:14px 0 0;text-align:center;font-size:1.05rem;font-weight:800}
.msg.win{color:var(--ok)}
#go{width:100%;min-height:64px;margin-top:6px;border:0;border-radius:18px;font:inherit;font-family:"Bagel Fat One","Arial Black",sans-serif;font-size:1.7rem;color:#3b1d00;background:linear-gradient(#ffd25a,var(--amber));box-shadow:0 7px 0 #a86d00,0 12px 20px rgba(0,0,0,.4);cursor:pointer;transition:transform .08s,box-shadow .08s}
#go:active{transform:translateY(5px);box-shadow:0 2px 0 #a86d00}
#go:disabled{filter:grayscale(.6);cursor:wait}
#go:focus-visible{outline:4px solid #fff;outline-offset:3px}
.stats{display:flex;gap:10px;width:100%}
.stat{flex:1;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--amber);font-family:"Bagel Fat One",sans-serif;font-weight:400}
.stat span{font-size:.8rem;color:var(--mute)}
.legend{margin:0;font-size:.82rem;color:var(--mute);text-align:center}
#trophy{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,3,12,.78);z-index:50;padding:20px}
#trophy.on{display:grid}
.card{background:linear-gradient(#5a1b45,#3a1030);border:3px solid var(--amber);border-radius:28px;padding:26px 22px;text-align:center;max-width:340px;width:100%;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.card .t{font-size:5rem;line-height:1}
.card h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:2rem;margin:8px 0;color:var(--amber)}
.card img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--amber)}
.card button{margin-top:14px;min-height:52px;padding:0 28px;border:0;border-radius:14px;background:var(--amber);color:#3b1d00;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:60;will-change:transform,opacity}
.fx img{width:100%;height:100%;border-radius:50%;object-fit:cover}
@media (max-height:640px){main{justify-content:flex-start}.sub{display:none}}
@media (prefers-reduced-motion:reduce){.reel.spin>*{animation:none}.reel.win{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Caça-Níquel da Cervejinha</h1>
    <p class="sub">Gire e junte 3 iguais. Três gatinhas valem o troféu!</p>
  </header>
  <section class="machine" aria-label="Caça-níquel">
    <div class="reels" id="reels" aria-live="polite">
      <div class="reel"></div><div class="reel"></div><div class="reel"></div>
    </div>
    <p class="msg" id="msg">Toque em Girar para começar</p>
    <button id="go" type="button">Girar</button>
  </section>
  <div class="stats">
    <div class="stat"><b id="spins">0</b><span>Giros</span></div>
    <div class="stat"><b id="wins">0</b><span>Vitórias</span></div>
    <div class="stat"><b id="coins">0</b><span>Moedas</span></div>
  </div>
  <p class="legend">🍺 +10 · 🍟 +15 · ❤️ +20 · gatinha +100 e troféu</p>
</main>

  if(busy)return;busy=true;go.disabled=true;
  st.spins++;upd();msg.className="msg";msg.textContent="Girando...";
  reels.forEach(function(r){r.className="reel spin"});
  var res=pick();
  var iv=setInterval(function(){reels.forEach(function(r,i){if(r.classList.contains("spin"))draw(r,SYM[rnd(4)])});tone(300+rnd(200),.04,"square")},90);
  reels.forEach(function(r,i){
    setTimeout(function(){
      r.className="reel stop";draw(r,SYM[res[i]]);tone(520+i*140,.12,"triangle");buzz(15);
      if(i===2){clearInterval(iv);end(res)}
    },calm?200*(i+1):800+i*550);
  });
}
function end(res){
  var win=res[0]===res[1]&&res[1]===res[2];
  if(win){
    var s=SYM[res[0]];st.wins++;st.coins+=s.p;
    reels.forEach(function(r){r.classList.add("win")});
    msg.className="msg win";
    if(s.img){msg.textContent="JACKPOT! Três gatinhas! +100 moedas";shower(110,true);fanfare();setTimeout(function(){document.getElementById("trophy").classList.add("on");document.getElementById("close").focus()},900)}
    else{msg.textContent="Ganhou! 3 iguais! +"+s.p+" moedas";shower(55,false);tone(660,.15,"triangle");setTimeout(function(){tone(880,.2,"triangle")},150)}
    buzz([60,40,60,40,120]);
  }else{msg.textContent="Quase! Tente de novo."}
  upd();busy=false;go.disabled=false;
}
function fanfare(){[523,659,784,1047,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.22,"triangle")},i*130)})}
function upd(){document.getElementById("spins").textContent=st.spins;document.getElementById("wins").textContent=st.wins;document.getElementById("coins").textContent=st.coins}
var E=["💰","🪙","❤️","🪙","💖","🍺","🪙"];
function shower(n,big){
  if(calm)n=Math.min(n,16);
  var W=innerWidth,H=innerHeight;
  for(var i=0;i<n;i++){(function(){
    var d=document.createElement("div");d.className="fx";
    var sz=22+rnd(big?44:30);d.style.width=d.style.height=sz+"px";d.style.fontSize=sz+"px";d.style.lineHeight="1";
    if(big&&Math.random()<.18){var im=new Image();im.src=CAT;im.alt="";d.appendChild(im)}else d.textContent=E[rnd(E.length)];
    document.body.appendChild(d);
    var x=Math.random()*(W-sz),y0=H+20,dx=(Math.random()-.5)*160,rot=(Math.random()-.5)*720;
    var a=d.animate([{transform:"translate("+x+"px,"+y0+"px) rotate(0deg)",opacity:1},{transform:"translate("+(x+dx)+"px,"+(-sz-40)+"px) rotate("+rot+"deg)",opacity:1,offset:.85},{transform:"translate("+(x+dx)+"px,"+(-sz-60)+"px) rotate("+rot+"deg)",opacity:0}],{duration:1800+Math.random()*1800,delay:Math.random()*700,easing:"cubic-bezier(.2,.6,.3,1)",fill:"backwards"});
    a.onfinish=function(){d.remove()};
  })()}
}
go.addEventListener("click",spin);
document.getElementById("close").addEventListener("click",function(){document.getElementById("trophy").classList.remove("on");go.focus()});
document.addEventListener("keydown",function(e){if(e.code==="Space"&&e.target===document.body){e.preventDefault();spin()}});
})();
</script>
</body>
</html>
